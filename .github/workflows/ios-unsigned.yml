name: KUBIKORN_MARKET iOS unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'web/**'
      - '.github/workflows/ios-unsigned.yml'

permissions:
  contents: read

jobs:
  build-ios:
    name: Build unsigned iPhone IPA
    runs-on: macos-15-intel
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Inspect project and ensure shared Xcode scheme
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner: $(uname -m) / $(sw_vers -productVersion)"
          xcodebuild -version

          PROJECT="ios/KUBIKORN_MARKET.xcodeproj"
          PBXPROJ="$PROJECT/project.pbxproj"
          APP_DIR="ios/KUBIKORN_MARKET"
          SCHEME_DIR="$PROJECT/xcshareddata/xcschemes"
          SCHEME_FILE="$SCHEME_DIR/KUBIKORN_MARKET.xcscheme"

          test -d "$PROJECT" || { echo "::error::Missing $PROJECT"; find ios -maxdepth 5 -print || true; exit 1; }
          test -f "$PBXPROJ" || { echo "::error::Missing $PBXPROJ"; exit 1; }
          test -f "$APP_DIR/AppDelegate.swift" || { echo "::error::Missing $APP_DIR/AppDelegate.swift"; exit 1; }
          test -f "$APP_DIR/Info.plist" || { echo "::error::Missing $APP_DIR/Info.plist"; exit 1; }
          test -f "$APP_DIR/www/index.html" || { echo "::error::Missing $APP_DIR/www/index.html"; exit 1; }

          # The project target identifier is A50000000000000000000001 in project.pbxproj.
          # Create a shared scheme when the uploaded project does not include one.
          if [[ ! -f "$SCHEME_FILE" ]]; then
            echo "[INFO] Shared scheme missing; creating KUBIKORN_MARKET.xcscheme."
            mkdir -p "$SCHEME_DIR"
            cat > "$SCHEME_FILE" <<'SCHEME'
          <?xml version="1.0" encoding="UTF-8"?>
          <Scheme LastUpgradeVersion="1600" version="1.7">
             <BuildAction parallelizeBuildables="YES" buildImplicitDependencies="YES">
                <BuildActionEntries>
                   <BuildActionEntry buildForTesting="YES" buildForRunning="YES" buildForProfiling="YES" buildForArchiving="YES" buildForAnalyzing="YES">
                      <BuildableReference BuildableIdentifier="primary" BlueprintIdentifier="A50000000000000000000001" BuildableName="KUBIKORN_MARKET.app" BlueprintName="KUBIKORN_MARKET" ReferencedContainer="container:KUBIKORN_MARKET.xcodeproj"/>
                   </BuildActionEntry>
                </BuildActionEntries>
             </BuildAction>
             <TestAction buildConfiguration="Debug" selectedDebuggerIdentifier="Xcode.DebuggerFoundation.Debugger.LLDB" selectedLauncherIdentifier="Xcode.DebuggerFoundation.Launcher.LLDB" shouldUseLaunchSchemeArgsEnv="YES"/>
             <LaunchAction buildConfiguration="Debug" selectedDebuggerIdentifier="Xcode.DebuggerFoundation.Debugger.LLDB" selectedLauncherIdentifier="Xcode.DebuggerFoundation.Launcher.LLDB" launchStyle="0" useCustomWorkingDirectory="NO" ignoresPersistentStateOnLaunch="NO" debugDocumentVersioning="YES" debugServiceExtension="internal" allowLocationSimulation="YES"/>
             <ProfileAction buildConfiguration="Release" shouldUseLaunchSchemeArgsEnv="YES" savedToolIdentifier="" useCustomWorkingDirectory="NO" debugDocumentVersioning="YES"/>
             <AnalyzeAction buildConfiguration="Debug"/>
             <ArchiveAction buildConfiguration="Release" revealArchiveInOrganizer="YES"/>
          </Scheme>
          SCHEME
          fi

          echo "[INFO] Validating Xcode project and schemes..."
          mkdir -p build
          xcodebuild -list -project "$PROJECT" 2>&1 | tee build/xcode-project-validation.log
          grep -q 'KUBIKORN_MARKET' build/xcode-project-validation.log || {
            echo "::error::Xcode did not find target/scheme KUBIKORN_MARKET."
            exit 1
          }
          echo "[OK] Project and shared scheme are ready."

      - name: Build for a real iPhone (not Simulator)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          # IMPORTANT: -derivedDataPath must be used with -scheme.
          # xcodebuild -target plus -derivedDataPath triggers Xcode error 64.
          set -o pipefail
          xcodebuild \
            -project ios/KUBIKORN_MARKET.xcodeproj \
            -scheme KUBIKORN_MARKET \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY='' \
            build 2>&1 | tee build/xcodebuild.log

      - name: Package unsigned iPhone IPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH='build/DerivedData/Build/Products/Release-iphoneos/KUBIKORN_MARKET.app'
          if [[ ! -d "$APP_PATH" ]]; then
            echo "::error::Xcode did not produce KUBIKORN_MARKET.app"
            find build/DerivedData/Build/Products -maxdepth 5 -print 2>/dev/null || true
            exit 1
          fi
          mkdir -p build/ipa/Payload dist
          cp -R "$APP_PATH" build/ipa/Payload/KUBIKORN_MARKET.app
          (cd build/ipa && /usr/bin/zip -qry "$GITHUB_WORKSPACE/dist/KUBIKORN_MARKET-Unsigned.ipa" Payload)
          test -s dist/KUBIKORN_MARKET-Unsigned.ipa
          echo '[OK] Unsigned iPhone IPA created.'
          /usr/bin/du -h dist/KUBIKORN_MARKET-Unsigned.ipa
          /usr/bin/unzip -l dist/KUBIKORN_MARKET-Unsigned.ipa | sed -n '1,80p'

      - name: Upload unsigned iPhone IPA
        uses: actions/upload-artifact@v4
        with:
          name: KUBIKORN-MARKET-iOS-Unsigned-IPA
          path: dist/KUBIKORN_MARKET-Unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload Xcode build logs for troubleshooting
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KUBIKORN-MARKET-iOS-Build-Logs
          path: build/*.log
          if-no-files-found: warn
          retention-days: 7
