name: KUBIKORN_MARKET iOS unsigned IPA (Intel runner)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'web/**'
      - '.github/workflows/ios-unsigned.yml'

permissions:
  contents: read

jobs:
  build-ios:
    name: Build unsigned iPhone IPA
    # Use the Intel macOS pool instead of the default macos-15 ARM64 pool.
    # This can avoid long ARM runner queues during high-demand periods.
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show Xcode version and validate project
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner: $(uname -m) / $(sw_vers -productVersion)"
          xcodebuild -version
          test -d ios/KUBIKORN_MARKET.xcodeproj
          test -f ios/KUBIKORN_MARKET.xcodeproj/project.pbxproj
          test -f ios/KUBIKORN_MARKET.xcodeproj/xcshareddata/xcschemes/KUBIKORN_MARKET.xcscheme
          test -f ios/KUBIKORN_MARKET/Info.plist
          test -f ios/KUBIKORN_MARKET/AppDelegate.swift
          test -f ios/KUBIKORN_MARKET/www/index.html
          echo '[OK] Native iOS project structure is present.'
          echo '[INFO] Available Xcode schemes:'
          xcodebuild -list -project ios/KUBIKORN_MARKET.xcodeproj

      - name: Build for real iPhone (not Simulator)
        shell: bash
        run: |
          set -euo pipefail
          echo '[INFO] Starting device build on Intel macOS runner.'
          mkdir -p build
          xcodebuild \
            -project ios/KUBIKORN_MARKET.xcodeproj \
            -scheme KUBIKORN_MARKET \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY='' \
            build 2>&1 | tee build/xcodebuild.log

      - name: Package unsigned iPhone IPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH='build/DerivedData/Build/Products/Release-iphoneos/KUBIKORN_MARKET.app'
          if [[ ! -d "$APP_PATH" ]]; then
            echo '::error::Xcode did not produce KUBIKORN_MARKET.app'
            exit 1
          fi
          mkdir -p build/ipa/Payload dist
          cp -R "$APP_PATH" build/ipa/Payload/KUBIKORN_MARKET.app
          (cd build/ipa && /usr/bin/zip -qry "$GITHUB_WORKSPACE/dist/KUBIKORN_MARKET-Unsigned.ipa" Payload)
          test -s dist/KUBIKORN_MARKET-Unsigned.ipa
          /usr/bin/unzip -l dist/KUBIKORN_MARKET-Unsigned.ipa
          echo '[OK] Unsigned iPhone IPA created.'
          echo '[INFO] IPA size:'
          /usr/bin/du -h dist/KUBIKORN_MARKET-Unsigned.ipa

      - name: Upload unsigned iPhone IPA
        uses: actions/upload-artifact@v4
        with:
          name: KUBIKORN-MARKET-iOS-Unsigned-IPA
          path: dist/KUBIKORN_MARKET-Unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload Xcode build log for troubleshooting
        if: always() && hashFiles('build/xcodebuild.log') != ''
        uses: actions/upload-artifact@v4
        with:
          name: KUBIKORN-MARKET-iOS-Xcode-Log
          path: build/xcodebuild.log
          if-no-files-found: warn
          retention-days: 7
