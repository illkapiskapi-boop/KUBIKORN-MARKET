name: KUBIKORN_MARKET iOS unsigned IPA (macOS 26)

on:
  workflow_dispatch:

permissions:
  contents: read

# Keep only one iOS build queued/running for this branch.
concurrency:
  group: kubikorn-market-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build unsigned iPhone IPA
    # Switch from the busy macos-15-intel pool to the macOS 26 Apple Silicon pool.
    runs-on: macos-26
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show runner and validate project
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner architecture: $(uname -m)"
          sw_vers
          xcodebuild -version
          test -d ios/KUBIKORN_MARKET.xcodeproj || { echo '::error::Missing ios/KUBIKORN_MARKET.xcodeproj'; exit 1; }
          test -f ios/KUBIKORN_MARKET.xcodeproj/project.pbxproj || { echo '::error::Missing project.pbxproj'; exit 1; }
          test -f ios/KUBIKORN_MARKET/KUBIKORN_MARKET/Info.plist || test -f ios/KUBIKORN_MARKET/Info.plist || { echo '::error::Missing app Info.plist'; exit 1; }
          test -f ios/KUBIKORN_MARKET/AppDelegate.swift || { echo '::error::Missing AppDelegate.swift'; exit 1; }
          test -f ios/KUBIKORN_MARKET/www/index.html || { echo '::error::Missing bundled web/index.html'; exit 1; }
          echo '[INFO] Xcode schemes and targets:'
          xcodebuild -list -project ios/KUBIKORN_MARKET.xcodeproj

      - name: Build for a real iPhone (not Simulator)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/DerivedData build/logs
          set +e
          xcodebuild \
            -project ios/KUBIKORN_MARKET.xcodeproj \
            -scheme KUBIKORN_MARKET \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/KUBIKORN_MARKET.xcresult \
            -jobs 2 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY='' \
            build 2>&1 | tee build/xcodebuild.log
          result=${PIPESTATUS[0]}
          set -e
          if [[ "$result" -ne 0 ]]; then
            echo "::error::xcodebuild failed with exit code $result"
            exit "$result"
          fi

      - name: Package unsigned iPhone IPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH='build/DerivedData/Build/Products/Release-iphoneos/KUBIKORN_MARKET.app'
          if [[ ! -d "$APP_PATH" ]]; then
            echo '::error::Xcode did not produce KUBIKORN_MARKET.app'
            find build/DerivedData/Build/Products -maxdepth 4 -print || true
            exit 1
          fi
          mkdir -p build/ipa/Payload dist
          cp -R "$APP_PATH" build/ipa/Payload/KUBIKORN_MARKET.app
          (cd build/ipa && /usr/bin/zip -qry "$GITHUB_WORKSPACE/dist/KUBIKORN_MARKET-Unsigned.ipa" Payload)
          test -s dist/KUBIKORN_MARKET-Unsigned.ipa
          /usr/bin/unzip -t dist/KUBIKORN_MARKET-Unsigned.ipa
          echo '[OK] Unsigned IPA created.'
          /usr/bin/du -h dist/KUBIKORN_MARKET-Unsigned.ipa

      - name: Upload unsigned iPhone IPA
        uses: actions/upload-artifact@v4
        with:
          name: KUBIKORN-MARKET-iOS-Unsigned-IPA
          path: dist/KUBIKORN_MARKET-Unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload Xcode diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KUBIKORN-MARKET-iOS-Diagnostics
          path: |
            build/xcodebuild.log
            build/KUBIKORN_MARKET.xcresult
          if-no-files-found: warn
          retention-days: 7
