name: KUBIKORN_MARKET iOS unsigned IPA (Xcode diagnostics 1.2.0)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kubikorn-market-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build unsigned iPhone IPA
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode 16.4 and validate project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/diagnostics
          export DEVELOPER_DIR="/Applications/Xcode_16.4.app/Contents/Developer"
          if [[ ! -d "$DEVELOPER_DIR" ]]; then
            echo "::error::Xcode 16.4 is missing at $DEVELOPER_DIR"
            ls -la /Applications | grep -i Xcode || true
            exit 1
          fi
          sudo xcode-select --switch "$DEVELOPER_DIR"
          {
            echo "Runner architecture: $(uname -m)"
            echo "macOS: $(sw_vers -productVersion)"
            echo "Developer dir: $(xcode-select -p)"
            xcodebuild -version
            echo "iPhoneOS SDK: $(xcrun --sdk iphoneos --show-sdk-version)"
          } 2>&1 | tee build/runner-info.log

          PROJECT="ios/KUBIKORN_MARKET.xcodeproj"
          APP_DIR="ios/KUBIKORN_MARKET"
          test -d "$PROJECT" || { echo "::error::Missing $PROJECT"; find ios -maxdepth 5 -print || true; exit 1; }
          test -f "$PROJECT/project.pbxproj" || { echo '::error::Missing project.pbxproj'; exit 1; }
          test -f "$PROJECT/xcshareddata/xcschemes/KUBIKORN_MARKET.xcscheme" || { echo '::error::Missing shared Xcode scheme'; exit 1; }
          test -f "$APP_DIR/AppDelegate.swift" || { echo '::error::Missing AppDelegate.swift'; exit 1; }
          test -f "$APP_DIR/Info.plist" || { echo '::error::Missing Info.plist'; exit 1; }
          test -f "$APP_DIR/www/index.html" || { echo '::error::Missing www/index.html'; exit 1; }
          test -f "$APP_DIR/Assets.xcassets/AppIcon.appiconset/Contents.json" || { echo '::error::Missing AppIcon Contents.json'; exit 1; }
          plutil -lint "$PROJECT/project.pbxproj"
          plutil -lint "$APP_DIR/Info.plist"
          python3 -m json.tool "$APP_DIR/Assets.xcassets/AppIcon.appiconset/Contents.json" >/dev/null
          xcodebuild -list -project "$PROJECT" 2>&1 | tee build/xcode-project-validation.log
          grep -q 'KUBIKORN_MARKET' build/xcode-project-validation.log
          echo '[OK] iOS source, scheme, plist and app icon validated.'

      - name: Probe Xcode build settings (without compiling)
        shell: bash
        continue-on-error: true
        run: |
          set +e
          export DEVELOPER_DIR="/Applications/Xcode_16.4.app/Contents/Developer"
          xcodebuild \
            -project ios/KUBIKORN_MARKET.xcodeproj \
            -scheme KUBIKORN_MARKET \
            -configuration Release \
            -sdk iphoneos \
            -showBuildSettings \
            > build/xcode-show-build-settings.log 2>&1
          STATUS=$?
          echo "$STATUS" > build/xcode-show-build-settings.exitcode
          echo "showBuildSettings exit code: $STATUS"
          exit 0

      - name: Build for a real iPhone (diagnostic mode)
        shell: bash
        run: |
          set -uo pipefail
          export DEVELOPER_DIR="/Applications/Xcode_16.4.app/Contents/Developer"
          mkdir -p build/DerivedData build/diagnostics
          ulimit -c unlimited || true
          echo '[INFO] Starting xcodebuild without -resultBundlePath to isolate result-bundle crashes.'
          set +e
          xcodebuild \
            -project ios/KUBIKORN_MARKET.xcodeproj \
            -scheme KUBIKORN_MARKET \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build/DerivedData" \
            -jobs 1 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY='' \
            build 2>&1 | tee build/xcodebuild.log
          STATUS=${PIPESTATUS[0]}
          set -e
          echo "$STATUS" > build/xcodebuild.exitcode
          if [[ "$STATUS" -ne 0 ]]; then
            echo "::error::xcodebuild failed with exit code $STATUS"
            exit "$STATUS"
          fi
          echo '[OK] Xcode build completed.'

      - name: Package unsigned iPhone IPA
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/KUBIKORN_MARKET.app"
          if [[ ! -d "$APP_PATH" ]]; then
            echo '::error::KUBIKORN_MARKET.app was not produced.'
            find build/DerivedData/Build/Products -maxdepth 5 -print 2>/dev/null || true
            exit 1
          fi
          mkdir -p build/ipa/Payload dist
          /usr/bin/ditto "$APP_PATH" build/ipa/Payload/KUBIKORN_MARKET.app
          (cd build/ipa && /usr/bin/zip -qry "$GITHUB_WORKSPACE/dist/KUBIKORN_MARKET-Unsigned.ipa" Payload)
          test -s dist/KUBIKORN_MARKET-Unsigned.ipa
          /usr/bin/unzip -t dist/KUBIKORN_MARKET-Unsigned.ipa
          echo '[OK] Unsigned IPA created.'

      - name: Collect modern macOS crash reports and Xcode diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p build/diagnostics
          echo "Collection time: $(date -u '+%Y-%m-%dT%H:%M:%SZ')" > build/diagnostics/collection-info.txt
          echo "Runner: $(uname -a)" >> build/diagnostics/collection-info.txt
          # Modern macOS crash reports are usually .ips; older systems may use .crash.
          for REPORT_DIR in \
            "$HOME/Library/Logs/DiagnosticReports" \
            "/Library/Logs/DiagnosticReports" \
            "$HOME/Library/Logs/CrashReporter" \
            "/Library/Logs/CrashReporter"; do
            if [[ -d "$REPORT_DIR" ]]; then
              find "$REPORT_DIR" -maxdepth 2 -type f -mmin -180 \
                \( -iname '*xcodebuild*.ips' -o -iname '*xcodebuild*.crash' \
                   -o -iname '*xcbuild*.ips' -o -iname '*xcbuild*.crash' \
                   -o -iname '*swift-frontend*.ips' -o -iname '*swift-frontend*.crash' \
                   -o -iname '*actool*.ips' -o -iname '*actool*.crash' \
                   -o -iname '*ibtoold*.ips' -o -iname '*ibtoold*.crash' \) \
                -print -exec cp -p {} build/diagnostics/ \; 2>/dev/null
            fi
          done
          # Save unified logs around the Xcode crash; this can reveal the crashing process even without an .ips file.
          log show --last 20m --style compact \
            --predicate '(process == "xcodebuild") OR (process == "XCBBuildService") OR (process == "swift-frontend") OR (process == "actool") OR (process == "ibtoold")' \
            > build/diagnostics/unified-xcode-log.txt 2>&1 || true
          # Include Xcode's build activity logs if present.
          if [[ -d build/DerivedData/Logs/Build ]]; then
            /usr/bin/ditto -c -k --sequesterRsrc --keepParent \
              build/DerivedData/Logs/Build build/diagnostics/DerivedData-Build-Logs.zip || true
          fi
          echo '[INFO] Collected diagnostic files:'
          find build/diagnostics -maxdepth 3 -type f -print || true

      - name: Upload unsigned iPhone IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KUBIKORN-MARKET-iOS-Unsigned-IPA
          path: dist/KUBIKORN_MARKET-Unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload Xcode crash diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KUBIKORN-MARKET-iOS-Crash-Diagnostics-1.2.0
          path: |
            build/*.log
            build/*.exitcode
            build/diagnostics/**
          if-no-files-found: warn
          retention-days: 7
